schema_version: 1
tool_version: v1.6.2
tool_checksums_sha256: 2a740a44fee468f042b4a66e086fc01a02d8d28877c9b1866e278102665b35ad

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/cli
        - ./adapters/http
        - ./adapters/idempotency
        - ./adapters/lease
        - ./adapters/otel
        - ./adapters/queue
        - ./adapters/service
        - ./adapters/slog
        - ./cron
        - ./history
        - ./idempotency
        - ./lease
        - ./memory
        - ./postgres
        - ./queue
        - ./schedulercli
        - ./schedulerhttp
        - ./schedulerservice
        - ./schedulertest
        - ./telemetry
        - ./valkey

operations:
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: ["./..."]
        run: '^Example'
        count: 1
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleCompilation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleOptions$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
