schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapters/cli
        - ./adapters/http
        - ./adapters/idempotency
        - ./adapters/lease
        - ./adapters/otel
        - ./adapters/queue
        - ./adapters/service
        - ./adapters/slog
        - ./cron
        - ./history
        - ./memory
        - ./postgres
        - ./schedulertest
        - ./valkey

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestConcurrentReplicasDispatchOnePhysicalOccurrence$'
        count: 1
        race: true
        timeout: 90s
      - type: go-test
        packages: ["./adapters/service"]
        run: '^TestPlanStopsSchedulingDrainsExecutionsThenClosesFacilities$'
        count: 1
        race: true
        timeout: 90s
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: ["./..."]
        run: '^Example'
        count: 1
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleCompilation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleOptions$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
