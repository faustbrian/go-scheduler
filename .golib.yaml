schema_version: 1
tool_version: v1.0.5
tool_checksums_sha256: 7ee6c6c9bccd76cc1071fb891073055d393701abaed047e0357370f128ba771b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./cron
        - ./history
        - ./idempotency
        - ./lease
        - ./memory
        - ./postgres
        - ./queue
        - ./schedulercli
        - ./schedulerhttp
        - ./schedulerservice
        - ./schedulertest
        - ./telemetry
        - ./valkey

operations:
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: ["./..."]
        run: '^Example'
        count: 1
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleCompilation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzScheduleOptions$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: "."
        budget: 100ms
        timeout: 20m
