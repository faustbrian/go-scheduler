name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: aa730a67fb33b378889bda98497e406ed02c793a
          path: .golib-tooling
          persist-credentials: false
      - uses: ./.golib-tooling/.github/actions/setup-golib
        with:
          source_bootstrap: true
          tooling_sha: aa730a67fb33b378889bda98497e406ed02c793a
      - name: Validate repository contracts
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/scheduler-contracts.XXXXXX")"
          trap 'chmod -R u+w "${task}"; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/build" "${task}/modules" "${task}/tmp"
          export GOCACHE="${task}/build" GOMODCACHE="${task}/modules" GOTMPDIR="${task}/tmp"
          export GOFLAGS='-p=1 -modcacherw'
          golib repository check
          golib cohesion check
          golib api check
          golib docs check --module .
          go vet ./...
          go test ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --allow-parallel-runners --timeout=10m ./...
      - name: Remove source bootstrap workspace
        if: always()
        run: |
          set -euo pipefail
          target="${GOLIB_SOURCE_INSTALL_ROOT:-}"
          if [[ -n "${target}" ]]; then
            case "${target}" in
              "${RUNNER_TEMP}"/golib-source-install.*) ;;
              *) echo 'refuse unrelated cleanup target' >&2; exit 1 ;;
            esac
            if [[ -d "${target}" ]]; then
              chmod -R u+w "${target}"
              find "${target}" -depth -delete
            fi
          fi

  ci:
    if: github.event_name != 'pull_request'
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@aa730a67fb33b378889bda98497e406ed02c793a
    with:
      tooling_sha: aa730a67fb33b378889bda98497e406ed02c793a
      source_bootstrap: true
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}

  required:
    name: Required
    if: always()
    needs: [pull-request, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          PR_RESULT: ${{ needs.pull-request.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          test "${PR_RESULT}:${CI_RESULT}" = "success:skipped" ||
            test "${PR_RESULT}:${CI_RESULT}" = "skipped:success"
