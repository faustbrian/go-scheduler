name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 0eaeb3405839b19ca6958784e7c55b55e3358ee1 # v1.6.2
          path: .golib-tooling
          persist-credentials: false
      - uses: ./.golib-tooling/.github/actions/setup-golib
      - name: Validate repository contracts
        run: |
          golib repository check
          golib cohesion check
          golib api check
          golib docs check --module .
          go vet ./...
          go test ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --allow-parallel-runners --timeout=10m ./...

  ci:
    if: github.event_name != 'pull_request'
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@0eaeb3405839b19ca6958784e7c55b55e3358ee1 # v1.6.2
    with:
      tooling_sha: 0eaeb3405839b19ca6958784e7c55b55e3358ee1
      release_dry_run: ${{ inputs.release_dry_run || false }}

  required:
    name: Required
    if: always()
    needs: [pull-request, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow
        env:
          PR_RESULT: ${{ needs.pull-request.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          test "${PR_RESULT}:${CI_RESULT}" = "success:skipped" ||
            test "${PR_RESULT}:${CI_RESULT}" = "skipped:success"
